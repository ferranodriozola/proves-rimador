<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualització completada - Rimador.cat</title>
    
    <!-- Redirecció automàtica al cap de 4 segons -->
    <meta http-equiv="refresh" content="4;url=https://rimador.cat">
    
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
            --box-bg: #ffffff;
            --text-color: #555555;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            background-color: var(--box-bg);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 450px;
            width: 90%;
            border-top: 5px solid var(--accent-color);
        }

        h1 {
            color: var(--primary-color);
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 15px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* Animació de càrrega */
        .spinner {
            margin: 25px auto;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(52, 152, 219, 0.2);
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .fallback-text {
            font-size: 14px;
            color: #888;
            margin-top: 30px;
        }

        a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #2980b9;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ja hem fet l'actualització!</h1>
        <p>Hem millorat el nostre sistema per continuar oferint-te la millor eina per trobar rimes en català.</p>
        
        <div class="spinner"></div>
        
        <p>T'estem redirigint a la nova versió...</p>
        
        <p class="fallback-text">
            Si no et redirigeix automàticament en uns segons, <br>
            <a href="https://rimador.cat">fes clic aquí per anar a rimador.cat</a>.
        </p>
    </div>

    <!-- Script de seguretat (fallback) per si falla el meta refresh -->
    <script>
        setTimeout(function() {
            window.location.href = "https://rimador.cat";
        }, 4000); // 4000 mil·lisegons = 4 segons
    </script>

</body>
</html>
