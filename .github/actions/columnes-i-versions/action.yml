name: Columnes internades, versions i comit
description: >-
  El final compartit dels dos workflows que refan el diccionari (la separació
  i la generació). Les tres passes van SEMPRE juntes i en aquest ordre, i per
  això viuen aquí i no pas copiades a cada workflow.

inputs:
  missatge:
    description: El text del commit (cada workflow hi diu com ha refet el diccionari).
    required: true

runs:
  using: composite
  steps:
    # Va just després de refer les columnes i just abans de les versions. Així
    # les internades no poden quedar endarrerides: es tornen a fer a cada
    # passada, surtin o no canviades. Si algun dia s'escapa (perquè algú les ha
    # comitejat a mà), el generar_versions.py de sota se n'adona i atura tot.
    - name: Generar columnes internades
      shell: bash
      run: python diccionaris/pythons/generar_columnes_internades.py

    # Ha d'anar ABANS del comit: aquest script només reescriu sis de les deu
    # columnes, i si des de la columna 10 s'hi ha afegit o tret cap línia, les
    # síl·labes i els enllaços quedarien desquadrats. Si passa, peta i el
    # workflow s'atura aquí, sense publicar un diccionari trencat.
    - name: Actualitzar versions.json
      shell: bash
      run: python diccionaris/pythons/generar_versions.py

    - name: Comit diccionari i columnes
      uses: ./.github/actions/comitejar
      with:
        missatge: ${{ inputs.missatge }}
