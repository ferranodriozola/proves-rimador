name: Bot de Rimes a Twitter (tarda, nàufragues)

on:
  #schedule:
  #  - cron: '15 18 * * *'
  
  workflow_dispatch:

jobs:
  publicar_tuit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout del repositori
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal·lar dependències (Tweepy)
        run: |
          pip install tweepy
          pip install numpy

      - name: Executar l'script de Python 
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
        run: python bot/script_naufragues.py

      - name: Guardar els canvis al JSON (Commit & Push)
        uses: ./.github/actions/comitejar
        with:
          missatge: 'Actualització automàtica: Rima diària afegida a publicades_naufragues.json'
          fitxers: bot/publicades_naufragues.json
