name: Generador de diccionaris (i de nàufragues i heptasíl·labs)

# S'engega quan s'edita la columna 10 a mà. Fa, per aquest ordre:
#
#   1. munta el diccionari base    -> NOMÉS diccionari.5.2.3.txt
#   2. reparteix la columna 10     -> "col_10 (canvis aquí)"
#   3. formes amb pronom           -> llegides del diccionari base
#   4. diccionari.6.txt            -> base + formes amb pronom
#   5. columnes del web            -> del diccionari que digui config.py
#   6. llistes derivades           -> ja sobre les columnes noves
#
# Els passos 3 i 4 se salten si config.py publica el diccionari base.
#
# Els passos 3 a 5 són el tram compartit amb el bessó de la separació i viuen
# a .github/actions/publicar-diccionari/.

on:
  push:
    paths:
      - 'diccionaris/separat/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # El checkout va sempre primer i no es pot amagar dins de cap acció
      # compartida: les accions de .github/actions/ són fitxers d'aquest
      # repositori, i fins que no hi ha checkout no existeixen al disc.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

# ------ PREPROCÉS (ajuntar les parts de la col_10 en el provisional)
      - name: Preprocés (generar col_10provisional a partir de les parts de col_10)
        run: python "diccionaris/python/pre_proces.py"

# ------ Muntar el diccionari base. Els camps que la columna 10 no porta
#        (síl·labes i enllaços) els pren del diccionari que ja hi ha, fila per
#        fila; per això no en pot sortir cap columna del diccionari publicat.
      - name: Crear diccionari
        run: python "diccionaris/python/creador_rima + dicc (a partir de col_10).py"

# ------ POSTPROCÉS (tornar a repartir la col_10 i esborrar el provisional)
#        Puja aquí, abans de publicar: així tot el que ha canviat entra en un
#        sol commit, en comptes dels dos que hi havia.
      - name: Postprocés (regenerar les parts de col_10 i eliminar col_10provisional)
        run: python "diccionaris/python/post_proces.py"

# ------ Pronoms, diccionari.6.txt, columnes del web, versions i comit
      - name: Publicar el diccionari
        uses: ./.github/actions/publicar-diccionari
        with:
          missatge: Generació automàtica del diccionari i les columnes

# ------ Llistes derivades (json de rimes, nàufragues i mots de 7)
#        Job a part, amb "needs", perquè ha de començar quan les columnes noves
#        ja són comitejades a main: és d'allà que se les baixa.
  llistes:
    needs: build
    uses: ./.github/workflows/generar_llistes.yml
