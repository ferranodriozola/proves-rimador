name: Generador de diccionaris (i de nàufragues i heptasíl·labs)

on:
  push:
    paths:
      - 'diccionaris/separat/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

# ------ PREPROCÉS (preparació generació [500]col_10.txt)
      - name: Preprocés (generar col_10provisional a partir de les parts de col_10)
        run: python "diccionaris/pythons/pre_proces.py"

# ------ generar diccionari.txt
      - name: Crear diccionari
        run: python "diccionaris/pythons/creador_rima + dicc (a partir de col_10).py"

# ----- columnes internades (separat/internat/)
#       Va SEMPRE aquí, just després de refer les columnes i just abans de
#       les versions. Així les internades no poden quedar endarrerides:
#       es tornen a fer a cada passada, surtin o no canviades. Si algun dia
#       s'escapa (perquè algú les ha comitejat a mà), el generar_versions.py
#       de sota se n'adona i atura el workflow.
      - name: Generar columnes internades
        run: python diccionaris/pythons/generar_columnes_internades.py

# ----- versions de les columnes (i comprovació que van totes a l'una)
#       Ha d'anar ABANS del comit: aquest script només reescriu sis de les
#       deu columnes, i si des de la columna 10 s'hi ha afegit o tret cap
#       línia, les síl·labes i els enllaços es quedarien desquadrats. Si
#       passa, generar_versions.py peta i el workflow s'atura aquí.
      - name: Actualitzar versions.json
        run: python diccionaris/pythons/generar_versions.py

# ------ comit columnes diccionari i diccionari (i versions.json)
      - name: Comit diccionari i columnes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Generació automàtica del diccionari i les columnes" || echo "No s'han detectat canvis nous per guardar"
          # Mentre corríem, un altre workflow pot haver comitejat. Sense
          # rebase, el push seria rebutjat i el workflow es posaria vermell.
          git pull --rebase origin main
          git push

# ------ POSTPROCÉS (generació [500]col_10.txt)
      - name: Postprocés (regenerar les parts de col_10 i eliminar col_10provisional)
        run: python "diccionaris/pythons/post_proces.py"

# ----- comit [500]col_10.txt
      - name: Comit columna 10 separada
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Generació automàtica de la columna_10 separada" || echo "No s'han detectat canvis nous per guardar"
          # Mentre corríem, un altre workflow pot haver comitejat. Sense
          # rebase, el push seria rebutjat i el workflow es posaria vermell.
          git pull --rebase origin main
          git push

# ------ Llistes derivades (json de rimes, nàufragues i mots de 7)
#        El bloc viu a generar_llistes.yml perquè aquest workflow i el bessó
#        el necessiten igual. Va en un job a part, amb "needs", perquè ha de
#        començar quan les columnes noves ja són comitejades a main.
  llistes:
    needs: build
    uses: ./.github/workflows/generar_llistes.yml
