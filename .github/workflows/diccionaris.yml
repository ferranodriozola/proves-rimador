name: Canvis al diccionari (i generació de nàufragues i heptasíl·labs)

# S'engega quan s'edita a mà qualsevol de les dues fonts:
#
#   diccionaris/diccionari.5.2.3.txt   QUINES paraules hi ha
#   diccionaris/col_10.txt             COM sona cadascuna, a tots els dialectes
#
# Abans eren dos workflows, un per font, perquè cadascuna tenia el seu script.
# Ara totes dues acaben al mateix lloc (els col_9 de dialectes_col/) i el pas
# que els escriu no necessita saber d'on ve el canvi: n'hi ha prou amb un.
#
# Fa, per aquest ordre:
#
#   1. sincronitzar  diccionari + col_10 -> tots dos corregits i els col_9
#   2. columnes      diccionari -> col_0,1,2,5,6,7,8; col_9 -> col_3 i col_4
#   3. internar      cada columna -> taula + índexs
#   4. versions      ho comprova tot i escriu el versions.json
#   5. UN SOL COMMIT
#   6. llistes derivades -> ja sobre les columnes noves
#
# (Entremig del 1 i el 2 hi ha els tres passos de les formes amb pronom, que se
# salten mentre config.py publiqui el diccionari base.)
#
# Els passos 2 a 5 viuen a .github/actions/publicar-diccionari/, perquè són el
# tram que no depèn de què s'hagi tocat.
#
# SI ALGUN PAS PETA, no es comiteja res: el commit va l'últim i les columnes
# velles es queden servint-se. I com que el workflow es posa vermell, arriba el
# correu (Settings > Notifications > Actions).

# Una execució a la vegada. Sense això, dos pushos seguits engeguen dues
# execucions que fan "git push" totes dues, i el "git pull --rebase" del mig pot
# barrejar dues generacions a mitges del diccionari.
#
# cancel-in-progress: false, i no true: aquest job fa commits, i cancel·lar-lo a
# mig push deixaria el repositori a mitges. Encuant-los, a més, hi ha l'ordre
# garantit.
concurrency:
  group: diccionari
  cancel-in-progress: false

on:
  push:
    paths:
      - 'diccionaris/diccionari*.txt'
      - 'diccionaris/col_10.txt'
      # Una carpeta de dialecte nova, amb la seva transcripció a dins: el pas 1
      # la deixa estar i el 5 ja l'afegeix a la col_10.
      - 'dialectes_col/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # El checkout va sempre primer i no es pot amagar dins de cap acció
      # compartida: les accions de .github/actions/ són fitxers d'aquest
      # repositori, i fins que no hi ha checkout no existeixen al disc.
      - name: Checkout
        uses: actions/checkout@v5

      # Fixa la versió en comptes de dependre de la que porti la imatge
      # d'Ubuntu, que canvia sota teu sense avisar.
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

# ------ Que les transcripcions diguin el que diuen el diccionari i la col_10.
#        Van fila per fila amb el diccionari i no porten cap paraula a dins: si
#        s'hi ha esborrat una fila, s'ha d'esborrar de tots els col_9 o totes
#        les paraules de sota heretarien la pronúncia d'una altra. Qui diu
#        quina fila era quina paraula és la col_10.
#
#        Si al diccionari hi ha paraules NOVES que no són a la col_10, s'atura:
#        no hi ha manera d'endevinar com sonen.
      - name: Sincronitzar el diccionari i la columna 10
        run: python diccionaris/python/sincronitzar.py

# ------ Pronoms, diccionari.6.txt, columnes del web, rima, versions i comit
      - name: Publicar el diccionari
        uses: ./.github/actions/publicar-diccionari
        with:
          missatge: Generació automàtica del diccionari i les columnes

# ------ Llistes derivades (nàufragues i mots de 7)
#        Job a part, amb "needs", perquè ha de començar quan les columnes noves
#        ja són comitejades a main: és d'allà que se les baixa.
  llistes:
    needs: build
    uses: ./.github/workflows/generar_llistes.yml
