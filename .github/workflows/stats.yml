name: Actualització automàtica de les estadístiques

on:
  schedule:
    - cron: '01 22 * * *'
  workflow_dispatch:

jobs:
  actualitzar_estadistiques:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositori
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal·lar dependències
        run: pip install pandas

      - name: Executar l'script de Python
        run: python stats/stats.py

      - name: Guardar els canvis al JSON (Commit & Push)
        uses: ./.github/actions/comitejar
        with:
          missatge: 'Actualització automàtica: Estadístiques actualitzades'
          # Aquí sí que es diuen els fitxers un per un (i no pas "."): aquest
          # workflow corre cada nit per l'horari, i el repositori pot tenir
          # canvis d'un altre workflow a mig fer. Només han de sortir les dues
          # estadístiques.
          fitxers: stats/estadistiques_rimador.json stats/versions_stats.json
