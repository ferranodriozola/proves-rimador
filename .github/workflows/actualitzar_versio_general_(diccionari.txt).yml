name: Separació del diccionari (i generació de nàufragues i heptasíl·labs)

# S'engega quan s'edita el diccionari BASE a mà. Fa, per aquest ordre:
#
#   1. separa el diccionari base   -> NOMÉS la "col_10 (canvis aquí)"
#   2. formes amb pronom           -> llegides del diccionari base
#   3. diccionari.6.txt            -> base + formes amb pronom
#   4. columnes del web            -> del diccionari que digui config.py
#   5. llistes derivades           -> ja sobre les columnes noves
#
# Els passos 2 i 3 se salten si config.py publica el diccionari base.
#
# Els passos 2 a 4 són el tram compartit amb el bessó diccionaris.yml i viuen
# a .github/actions/publicar-diccionari/.

on:
  push:
    paths:
      - 'diccionaris/diccionari*.txt'
      # Editar una transcripció és editar el diccionari per l'altra banda: la
      # rima que se'n deriva s'ha de refer igual, i si el que s'ha tocat és el
      # central, també la columna 10, que és d'on la treu.
      - 'dialectes_col/**'
  workflow_dispatch:

jobs:
  update-general-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # El checkout va sempre primer i no es pot amagar dins de cap acció
      # compartida: les accions de .github/actions/ són fitxers d'aquest
      # repositori, i fins que no hi ha checkout no existeixen al disc.
      - name: Baixa el codi
        uses: actions/checkout@v4

      # Fixa la versió en comptes de dependre de la que porti la imatge
      # d'Ubuntu, que canvia sota teu sense avisar.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

# ------ Separar el diccionari base. NOMÉS en treu la columna 10: les
#        col_0..col_9 les fa després el generar_columnes_publicades.py, a
#        partir del diccionari que toqui. (Aquest script ja crida el
#        post_procés, que és qui reparteix la columna 10 en els seus fitxers.)
      - name: Separar diccionari
        run: python "diccionaris/python/separar_arxiu (per canvis a diccionari_txt).py"

# ------ Pronoms, diccionari.6.txt, columnes del web, versions i comit
      - name: Publicar el diccionari
        uses: ./.github/actions/publicar-diccionari
        with:
          missatge: Separació automàtica del diccionari

# ------ Llistes derivades (json de rimes, nàufragues i mots de 7)
#        Job a part, amb "needs", perquè ha de començar quan les columnes noves
#        ja són comitejades a main: és d'allà que se les baixa.
  llistes:
    needs: update-general-version
    uses: ./.github/workflows/generar_llistes.yml
