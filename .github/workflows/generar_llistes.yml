name: Generar llistes (json de rimes, nàufragues i mots de 7)

# Workflow reutilitzable: no s'engega tot sol. El criden amb un "uses:" els dos
# workflows que refan el diccionari, quan ja tenen les columnes noves comitejades.
#
# Abans aquestes passes eren copiades literalment als dos workflows, i tot canvi
# s'havia de fer dues vegades (o quedava a mitges en un dels dos).
#
# Com que es crida amb "uses:" i no pas amb workflow_run, corre com un job més de
# qui el crida: no genera cap execució a part i no dispara cap desplegament pel
# seu compte. La cadena cap a Pages continua penjant del nom del workflow que
# crida, que és el que hi ha llistat al workflow_run de deploy.yml.

on:
  workflow_call:

jobs:
  llistes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # La punta de main, que és on qui ens crida acaba de deixar les
          # columnes noves. Per defecte agafaríem el commit amb què va començar
          # l'execució, o sigui el diccionari VELL, i generaríem les llistes a
          # partir d'ell sense que res se'n queixés.
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

# ------ Generar resultat_ordenat_cons.json
      - name: Generar json de rimes sencer
        working-directory: bot
        run: python "generador_rimes_cons.py"

# ----- comit resultat_ordenat_cons.json
      - name: Comit json de rimes sencer
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Generació automàtica del json de rimes sencer" || echo "No s'han detectat canvis nous per guardar"
          git pull --rebase origin main
          git push

# ------ Crear llista nàufragues
      - name: Crear llista de naufragues
        working-directory: llistes
        run: python generar_naufragues.py

# ----- comit naufragues
      - name: Comit llista de nàufragues
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Generació automàtica de la llista de nàufragues" || echo "No s'han detectat canvis nous per guardar"
          git pull --rebase origin main
          git push

# ------ Crear llistes mots_de7
      - name: Crear llista de mots_de7
        working-directory: llistes
        run: |
          python generar_mots_de7_real.py
          python generar_mots_de7_glosa.py

# ----- comit mots_de7
      - name: Comit llista de mots de 7
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Generació automàtica de la llista de mots de 7" || echo "No s'han detectat canvis nous per guardar"
          git pull --rebase origin main
          git push